<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>นักสืบไขคดี — Detective Mystery</title>
<style>
:root{
  --ink:#1b2540;--ink2:#46506b;--bg:#f4eee0;--card:#fffdf7;--line:#d9cfb8;
  --navy:#16284a;--navy2:#22407a;--amber:#f2a516;--amber-d:#8a5a00;--teal:#0f766e;--ok:#15803d;--soft:#b45309;--soft-bg:#fff4dc;--ok-bg:#e3f6e8;
  --focus:#1d4ed8;--r:14px;--shadow:0 6px 18px rgba(22,40,74,.14);
  --font:"Noto Sans Thai","Sarabun","Leelawadee UI","Tahoma","Thonburi",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;overflow-wrap:anywhere}
h1,h2,h3{line-height:1.25;margin:.2em 0 .4em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 rgba(22,40,74,.25)}
.btn:hover{background:#eef2fb}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.amber{background:var(--amber);border-color:#7a4b00;color:#2b1b00}
.btn.amber:hover{background:#ffb92e}
.btn.danger{border-color:#9b1c1c;color:#9b1c1c}
.btn.sm{min-height:44px;padding:4px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{padding:8px 12px}
.screen{min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--navy);color:#fff}
.topbar h1{font-size:22px;margin:0;flex:1;min-width:160px}
.topbar .btn{background:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--ink2)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;background:#e8eefc;border:1px solid #b9c6ea;font-size:14px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#banner{background:var(--soft-bg);color:#6b3a00;border-bottom:2px solid var(--amber);padding:8px 16px;font-weight:600}

/* home */
.home{display:grid;place-items:center;min-height:100vh;padding:20px;background:
  radial-gradient(circle at 15% 20%,#fff6d6 0,transparent 40%),radial-gradient(circle at 85% 80%,#d8e6ff 0,transparent 45%),var(--bg)}
.home .box{max-width:760px;width:100%;text-align:center}
.home h1{font-size:clamp(34px,6vw,60px);color:var(--navy);margin:8px 0 0;letter-spacing:.5px}
.home .en{font-size:clamp(16px,2.4vw,22px);color:var(--amber-d);font-weight:700;letter-spacing:3px;text-transform:uppercase}
.home .lead{font-size:clamp(16px,2vw,20px);margin:10px auto 22px;max-width:560px;color:var(--ink2)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.menu .btn{min-height:58px;font-size:19px}
.home svg{width:min(210px,50vw);height:auto}
.homefoot{margin-top:18px;font-size:14px;color:var(--ink2)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field>label,.lbl{font-weight:700;font-size:15px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:2px solid #9aa6c4;border-radius:10px;background:#fff}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--navy);flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.hint{font-size:14px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}

/* studio */
.studio{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.caselist{display:flex;flex-direction:column;gap:8px}
.caseitem{width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;min-height:44px}
.caseitem[aria-current=true]{border-color:var(--navy);background:#e8eefc}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{min-height:44px;padding:6px 14px;border-radius:99px;border:2px solid var(--navy);background:#fff;font-weight:700;cursor:pointer;color:var(--navy)}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:#b91c1c;color:#fff;font-size:13px;margin-left:6px;text-align:center}
.badge.ok{background:var(--ok)}
.listrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border:2px solid var(--line);border-radius:12px;background:#fff;margin:6px 0}
.listrow.sel{border-color:var(--navy);background:#eef2fb}
.evgrid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.vitem{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:10px;margin:4px 0}
.vitem.err{background:#fde8e8;border-left:6px solid #b91c1c}
.vitem.warn{background:var(--soft-bg);border-left:6px solid var(--amber)}
.vitem.okk{background:var(--ok-bg);border-left:6px solid var(--ok)}
.thumb{max-width:160px;max-height:120px;border-radius:8px;border:2px solid var(--line)}

/* game */
.game{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#e9e1cc}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:var(--navy);color:#fff}
.hud .ttl{font-weight:800;font-size:18px;margin-right:6px;max-width:28ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .btn{min-height:44px;padding:4px 12px;font-size:15px;background:#fff}
.teams{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tchip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;border:3px solid transparent;font-size:15px;min-height:36px}
.tchip.cur{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,165,22,.55)}
.tchip b{font-size:18px}
.gtabs{display:none;gap:6px;padding:6px 10px;background:#101d38}
.gtabs .tab{flex:1;background:#fff}
.gtabs .tab[aria-selected=true]{background:var(--amber);color:#2b1b00;border-color:#7a4b00}
.gbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;padding:8px}
.pmap,.pboard{min-height:0;display:flex;flex-direction:column;gap:8px}
.pmap,.pboard{overflow:auto}
.mapwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:3px solid var(--navy);background:#222;box-shadow:var(--shadow);flex:none}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none}
.spots{display:flex;flex-wrap:wrap;gap:6px}
.spot{min-height:44px;padding:4px 12px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-weight:700;cursor:pointer;font-size:15px}
.spot.done{background:var(--ok-bg);border-color:var(--ok);color:#0d4f25}
.spot.lock{background:#e5e7eb;border-color:#9ca3af;color:#4b5563}
.panelcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px}
.pboard{background:var(--card);border:3px solid var(--navy);border-radius:var(--r);padding:8px}
.boardhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.boardhd h2{font-size:18px;margin:0;flex:1}
.board{position:relative;flex:1 0 340px;border-radius:12px;overflow:hidden;background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px),#b98a54;border:6px solid #6b4423;box-shadow:inset 0 0 30px rgba(0,0,0,.35);touch-action:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board svg .badgeg{pointer-events:all;cursor:pointer}
.note{position:absolute;transform:translate(-50%,-50%);border:0;cursor:grab;touch-action:none;text-align:left;font-weight:700;color:#2b2200;padding:8px 10px 8px 12px;box-shadow:3px 5px 10px rgba(0,0,0,.4);max-width:150px;min-width:92px;font-size:14px;line-height:1.25;user-select:none}
.note.ev{background:#fff176;transform:translate(-50%,-50%) rotate(-1.5deg);border-top:10px solid #f5d90a}
.note.ev:nth-of-type(even){transform:translate(-50%,-50%) rotate(1.5deg)}
.note.pe{background:#9fd8ff;border-radius:99px;text-align:center;padding:8px 14px;min-width:80px;border:3px solid #1d6fa5}
.note.ti{background:#c8f2c2;border-radius:8px;text-align:center;padding:5px 10px;min-width:64px;border:3px dashed #2f7d32;font-size:13px}
.note.sel{outline:4px solid var(--focus);outline-offset:3px;z-index:3}
.note.flash{animation:flash 1.2s 2}
.note small{display:block;font-weight:500;font-size:12px;opacity:.85}
.note img{width:100%;max-height:50px;object-fit:cover;border-radius:4px;display:block;margin-bottom:3px}
@keyframes flash{50%{box-shadow:0 0 0 8px rgba(242,165,22,.9)}}
.linklist{max-height:150px;overflow:auto;font-size:14px}
.linkitem{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--line)}
.lnum{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;text-align:center;font-weight:800;font-size:14px;line-height:26px;border:2px solid #fff;box-shadow:0 0 0 1px #000}
.statusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* dialogs */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;color:var(--ink)}
dialog::backdrop{background:rgba(10,18,38,.62)}
.dlgbox{background:var(--card);border:3px solid var(--navy);border-radius:18px;width:min(720px,94vw);max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dlgbox.wide{width:min(980px,96vw)}
.dlgbox>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff;border-radius:14px 14px 0 0}
.dlgbox>header h2{margin:0;font-size:20px;flex:1}
.dlgbox .x{min-width:44px;min-height:44px;border-radius:10px;border:0;background:#fff;color:var(--navy);font-size:24px;font-weight:700;cursor:pointer;line-height:1}
.dlgbody{padding:14px 16px;overflow:auto;flex:1}
.dlgbox>footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px 14px;border-top:2px solid var(--line);background:#f8f3e6;border-radius:0 0 14px 14px}
.qprompt{font-size:clamp(19px,2.6vw,26px);font-weight:700;margin:6px 0 12px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;min-height:52px;padding:8px 12px;border-radius:12px;border:3px solid #9aa6c4;background:#fff;cursor:pointer;font-size:clamp(17px,2.2vw,22px);font-weight:600;width:100%}
.opt:hover:not([disabled]){background:#eef2fb}
.opt[aria-checked=true]{border-color:var(--navy);background:#dfe8ff}
.opt .let{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.opt.tried{border-color:var(--amber);background:var(--soft-bg);color:#6b3a00}
.opt[disabled]{cursor:not-allowed;opacity:.75}
.fb{padding:10px 12px;border-radius:12px;margin-top:10px;font-weight:600}
.fb.soft{background:var(--soft-bg);border:2px solid var(--amber);color:#5a3200}
.fb.good{background:var(--ok-bg);border:2px solid var(--ok);color:#0d4f25}
.fb.info{background:#e8eefc;border:2px solid #9bb0e8}
.tbar{height:12px;border-radius:99px;background:#ddd;overflow:hidden;margin:6px 0}
.tbar>i{display:block;height:100%;background:var(--teal);transition:width .25s linear}
.tbar.low>i{background:var(--soft)}
.reveal{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(135deg,#fff8e1,#fff);border:3px solid var(--amber);padding:14px}
.reveal.anim{animation:spot 1s ease-out both}
@keyframes spot{from{clip-path:circle(0% at 50% 40%)}to{clip-path:circle(150% at 50% 40%)}}
.reveal h3{font-size:24px;margin:0 0 6px;color:var(--navy)}
.reveal .lensdeco{position:absolute;right:-18px;top:-18px;width:96px;height:96px;opacity:.15}
.reveal img.ei{max-width:100%;max-height:220px;border-radius:10px;border:2px solid var(--line);margin:6px 0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pausebox{text-align:center;padding:26px}
.pausebox .big{font-size:42px;font-weight:800;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101d38;color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:1000;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:var(--shadow)}
#toast.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:2000;width:100vw;height:100vh}

/* report + help */
.rep h2{margin-top:22px;border-bottom:3px solid var(--amber);padding-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:#eef2fb}
.step3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.step3 .card{text-align:center}
.step3 .n{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--amber);font-weight:800;font-size:22px;border:2px solid #7a4b00}
kbd{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:700}
.revealbox{border:3px solid var(--ok);background:var(--ok-bg);border-radius:14px;padding:12px 14px;margin:10px 0}
.pager{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pager i{width:10px;height:10px;border-radius:50%;background:#bbb}
.pager i.on{background:var(--navy)}

@media (max-width:960px){
  .studio,.evgrid{grid-template-columns:1fr}
  .gtabs{display:flex}
  .gbody{grid-template-columns:1fr;overflow:auto;grid-auto-rows:auto}
  .pmap,.pboard{overflow:visible}
  .board{flex:0 0 420px}
  .hud .ttl{flex:1 1 100%;max-width:none}
  .teams{flex:1 1 100%}
  .game[data-view=map] .pboard,.game[data-view=board] .pmap{display:none}
  .hud .ttl{max-width:16ch}
}
@media (max-width:480px){
  body{font-size:16px}
  .hud .btn{padding:4px 8px;font-size:14px}
  .gtabs .tab{padding:6px 6px;font-size:15px}
  .wrap{padding:10px}
  .note{max-width:112px;font-size:12.5px;min-width:70px}
  .dlgbody{padding:10px 12px}
  .btn{padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}
body.calm *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
body.calm .reveal.anim{animation:none}
@media print{
  body{background:#fff;font-size:12pt}
  .screen:not(#scrReport),dialog,#toast,#banner,.noprint{display:none!important}
  #scrReport{display:block!important}
  .card{box-shadow:none;border:1px solid #888}
  .revealbox{break-inside:avoid}
}
</style>
</head>
<body>
<a class="skip" href="#main">ข้ามไปที่เนื้อหา</a>
<div id="banner" hidden role="status"></div>
<main id="main">

<section id="scrHome" class="screen">
  <div class="home"><div class="box">
    <svg viewBox="0 0 220 160" role="img" aria-label="ภาพแว่นขยายนักสืบ">
      <defs><radialGradient id="gl" cx="40%" cy="35%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#bfe3ff" stop-opacity=".45"/></radialGradient></defs>
      <ellipse cx="110" cy="146" rx="80" ry="8" fill="#000" opacity=".12"/>
      <rect x="40" y="40" width="96" height="84" rx="8" fill="#fff176" stroke="#c9a900" stroke-width="3" transform="rotate(-6 88 82)"/>
      <path d="M58 70h60M58 86h44M58 102h52" stroke="#a88f00" stroke-width="5" stroke-linecap="round" transform="rotate(-6 88 82)"/>
      <circle cx="132" cy="70" r="38" fill="url(#gl)" stroke="#16284a" stroke-width="8"/>
      <path d="M160 98l34 38" stroke="#7a4b00" stroke-width="14" stroke-linecap="round"/>
      <path d="M160 98l-6-6" stroke="#16284a" stroke-width="10" stroke-linecap="round"/>
      <text x="132" y="84" text-anchor="middle" font-size="44" font-weight="800" fill="#d97706" font-family="sans-serif">?</text>
    </svg>
    <div class="en">Detective Mystery</div>
    <h1>นักสืบไขคดี</h1>
    <p class="lead">สืบเบาะแส เก็บหลักฐาน เชื่อมเหตุผล แล้วไขคดีของหายด้วยกันทั้งห้อง — ไม่มีความรุนแรง ใช้ได้ทุกวิชา</p>
    <div class="menu">
      <button class="btn primary" id="hmStart">เริ่มเล่น</button>
      <button class="btn amber" id="hmResume" hidden>เล่นต่อจากที่บันทึกไว้</button>
      <button class="btn" id="hmStudio">จัดการเนื้อหา</button>
      <button class="btn" id="hmSettings">ตั้งค่า</button>
      <button class="btn" id="hmHow">วิธีเล่น</button>
      <button class="btn" id="hmDemo">ทดลองเล่น</button>
    </div>
    <div class="homefoot" id="homeFoot"></div>
  </div></div>
</section>

<section id="scrHow" class="screen" hidden></section>
<section id="scrSettings" class="screen" hidden></section>
<section id="scrStudio" class="screen" hidden></section>
<section id="scrGame" class="screen" hidden></section>
<section id="scrReport" class="screen" hidden></section>

</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlgbox" id="dlgBox">
    <header><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="ปิดหน้าต่าง (Esc)">×</button></header>
    <div class="dlgbody" id="dlgBody"></div>
    <footer id="dlgFoot"></footer>
  </div>
</dialog>
<dialog id="dlgC" aria-labelledby="dlgCT">
  <div class="dlgbox">
    <header><h2 id="dlgCT">ยืนยัน</h2></header>
    <div class="dlgbody" id="dlgCB"></div>
    <footer id="dlgCF"></footer>
  </div>
</dialog>
<dialog id="dlgP" aria-labelledby="dlgPT">
  <div class="dlgbox">
    <header><h2 id="dlgPT">พักเกม</h2></header>
    <div class="pausebox"><div class="big">พักเกมอยู่</div><p>เวลาและกระดานถูกพักไว้ กด <kbd>Space</kbd> หรือปุ่มด้านล่างเพื่อเล่นต่อ</p>
      <button class="btn primary" id="pauseResume">เล่นต่อ</button></div>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" hidden aria-hidden="true"></canvas>
<script>
(()=>{'use strict';
/* =====================================================================
 * นักสืบไขคดี — Detective Mystery  (static, no network, no external libs)
 *
 * Data model (schemaVersion 1) — one "case":
 * { schemaVersion, id, title, subject, grade, story,
 *   rooms:[{id,name}] x4,
 *   characters:[{id,name,role,desc}] (3–5),
 *   evidence:[{id,title,desc,room:0-3,time,characterIds:[],supports:hypId|'',
 *              mandatory:bool,order:int,hint,image:dataURL|''}] (5–8),

  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(k==='for')e.htmlFor=v;
    else if(k.startsWith('aria-')||k==='role'||k==='data-id'||k==='tabindex'||k==='list')e.setAttribute(k,v===true?'':v);

    else e.setAttribute(k,v===true?'':v);

const reducedMotion=()=>document.body.classList.contains('calm')||matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage (localStorage only, never network) ---------- */
let storageOK=true;
function lsGet(k){try{const v=localStorage.getItem(KEY+':'+k);return v==null?null:JSON.parse(v);}catch(e){storageOK=false;return null;}}
function lsSet(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v));return true;}catch(e){
  storageOK=false;showBanner('เบราว์เซอร์ไม่อนุญาตให้บันทึกข้อมูล หรือพื้นที่เก็บเต็ม — ยังเล่นได้ แต่ข้อมูลจะไม่ถูกเก็บไว้ (ลองส่งออกไฟล์ JSON สำรองไว้)');return false;}}
function lsDel(k){try{localStorage.removeItem(KEY+':'+k);}catch(e){}}
function clearAllData(){try{Object.keys(localStorage).filter(k=>k.startsWith(KEY+':')).forEach(k=>localStorage.removeItem(k));}catch(e){}}
function showBanner(m){const b=$('#banner');b.textContent=m;b.hidden=false;}
function storageUsageKB(){try{let n=0;Object.keys(localStorage).filter(k=>k.startsWith(KEY+':')).forEach(k=>n+=(localStorage.getItem(k)||'').length*2);return Math.round(n/1024);}catch(e){return 0;}}
function probeStorage(){try{localStorage.setItem(KEY+':probe','1');localStorage.removeItem(KEY+':probe');}catch(e){storageOK=false;showBanner('เบราว์เซอร์ปิดการเก็บข้อมูล — ยังเล่นได้ตามปกติ แต่คดีที่แก้ไขและความคืบหน้าจะไม่ถูกบันทึกเมื่อปิดหน้า (ใช้ปุ่มส่งออก JSON เพื่อสำรอง)');}}

/* ---------- settings ---------- */
function defSettings(){return{mode:'teams',teamCount:2,teams:COLORS.map((c,i)=>({name:'ทีม '+(i+1),color:c})),
  scoreAnswer:10,scoreLink:10,scoreConclusion:20,timerEnabled:false,shuffle:true,sound:true,music:false,reduceMotion:false,tutorialSeen:false};}
function loadSettings(){
  const d=defSettings(),s=lsGet('settings');if(!s||typeof s!=='object')return d;
  d.mode=['teams','coop','solo'].includes(s.mode)?s.mode:d.mode;
  d.teamCount=int(s.teamCount,2,8,2);
  if(Array.isArray(s.teams))s.teams.slice(0,8).forEach((t,i)=>{if(t&&typeof t==='object'){d.teams[i].name=str(t.name,24,d.teams[i].name)||d.teams[i].name;if(/^#[0-9a-f]{6}$/i.test(t.color||''))d.teams[i].color=t.color;}});
  d.scoreAnswer=int(s.scoreAnswer,0,100,10);d.scoreLink=int(s.scoreLink,0,100,10);d.scoreConclusion=int(s.scoreConclusion,0,200,20);
  for(const k of['timerEnabled','shuffle','sound','music','reduceMotion','tutorialSeen'])d[k]=typeof s[k]==='boolean'?s[k]:d[k];
  return d;
}

/* ---------- case normalisation (structure only) ---------- */
function normalizeCase(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('ไฟล์นี้ไม่ใช่ข้อมูลคดี (ต้องเป็นออบเจ็กต์ JSON)');
  if(typeof raw.schemaVersion!=='number')throw new Error('ไม่พบ schemaVersion ในไฟล์');
  if(raw.schemaVersion>SCHEMA)throw new Error('ไฟล์นี้สร้างจากเวอร์ชันที่ใหม่กว่า (schemaVersion '+raw.schemaVersion+') กรุณาอัปเดตเกมก่อน');
  const arr=(v,n)=>Array.isArray(v)?v.slice(0,n):[];
  const c={schemaVersion:SCHEMA,id:str(raw.id,40)||uid('case_'),title:str(raw.title,80),subject:str(raw.subject,60),grade:str(raw.grade,20),story:str(raw.story,700)};
  const rooms=arr(raw.rooms,4).map((r,i)=>({id:str(r&&r.id,20)||'r'+i,name:str(r&&r.name,30)}));
  while(rooms.length<4)rooms.push({id:'r'+rooms.length,name:ROOM_DEF[rooms.length]});
  c.rooms=rooms;
  c.characters=arr(raw.characters,10).map(x=>({id:str(x&&x.id,20)||uid('c'),name:str(x&&x.name,30),role:str(x&&x.role,60),desc:str(x&&x.desc,200)}));
  c.evidence=arr(raw.evidence,20).map(x=>({id:str(x&&x.id,20)||uid('e'),title:str(x&&x.title,60),desc:str(x&&x.desc,500),
    room:int(x&&x.room,0,3,0),time:str(x&&x.time,20),characterIds:arr(x&&x.characterIds,10).filter(s=>typeof s==='string'),
    supports:str(x&&x.supports,20),mandatory:!!(x&&x.mandatory),order:int(x&&x.order,1,99,1),hint:str(x&&x.hint,200),
    image:(x&&typeof x.image==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]*$/.test(x.image)&&x.image.length<600000)?x.image:''}));
  c.questions=arr(raw.questions,30).map(x=>{
    const type=['single-choice','true-false','short-answer'].includes(x&&x.type)?x.type:'single-choice';
    const q={id:str(x&&x.id,20)||uid('q'),type,evidenceId:str(x&&x.evidenceId,20),prompt:str(x&&x.prompt,240),
      options:type==='single-choice'?arr(x&&x.options,8).map(o=>({id:str(o&&o.id,10)||uid('o'),text:str(o&&o.text,100)})):[],
      answer:type==='true-false'?(x.answer===true||x.answer==='true'):str(x&&x.answer,type==='short-answer'?240:10),
      explanation:str(x&&x.explanation,300),topic:str(x&&x.topic,60),difficulty:int(x&&x.difficulty,1,3,1)};
    return q;});
  c.hypotheses=arr(raw.hypotheses,10).map(x=>({id:str(x&&x.id,20)||uid('h'),text:str(x&&x.text,120),feedback:str(x&&x.feedback,200)}));
  const s=raw.solution&&typeof raw.solution==='object'?raw.solution:{};
  c.solution={answer:str(s.answer,20),explanation:str(s.explanation,600),steps:arr(s.steps,8).map(t=>str(t,400)),keyEvidence:arr(s.keyEvidence,20).filter(t=>typeof t==='string')};
  c.links=arr(raw.links,60).map(x=>({id:str(x&&x.id,20)||uid('l'),a:str(x&&x.a,40),b:str(x&&x.b,40),reason:str(x&&x.reason,200)}));
  const g=raw.gameConfig&&typeof raw.gameConfig==='object'?raw.gameConfig:{};
  c.gameConfig={difficulty:int(g.difficulty,1,3,2),enforceOrder:!!g.enforceOrder,requireMandatory:g.requireMandatory!==false,
    hintsPerGame:int(g.hintsPerGame,0,20,3),questionSeconds:int(g.questionSeconds,0,300,0),discussion:arr(g.discussion,8).map(t=>str(t,200)).filter(Boolean)};
  return c;
}
function blankCase(){
  const ids=['c1','c2','c3'];
  return normalizeCase({schemaVersion:1,title:'คดีใหม่ (ยังไม่ตั้งชื่อ)',story:'',rooms:ROOM_DEF.map((n,i)=>({id:'r'+i,name:n})),
    characters:ids.map((id,i)=>({id,name:'ตัวละคร '+(i+1),role:'',desc:''})),evidence:[],questions:[],
    hypotheses:[{id:'h1',text:'ทางเลือก 1',feedback:''},{id:'h2',text:'ทางเลือก 2',feedback:''},{id:'h3',text:'ทางเลือก 3',feedback:''}],
    solution:{answer:'h1',explanation:'',steps:[],keyEvidence:[]},links:[],gameConfig:{}});
}
function newEvidence(c){
  const eid=uid('e'),qid=uid('q');
  const used=c.evidence.map(e=>e.order),order=used.length?Math.max(...used)+1:1;
  c.evidence.push({id:eid,title:'หลักฐานชิ้นใหม่',desc:'',room:0,time:'',characterIds:[],supports:'',mandatory:false,order:Math.min(order,99),hint:'',image:''});
  c.questions.push({id:qid,type:'single-choice',evidenceId:eid,prompt:'',options:['a','b','c','d'].map(x=>({id:x,text:''})),answer:'a',explanation:'',topic:'',difficulty:1});
  return eid;
}

/* ---------- validation (before play + editor) ---------- */
const evOf=(c,id)=>c.evidence.find(e=>e.id===id);
const qOf=(c,evId)=>c.questions.find(q=>q.evidenceId===evId);
function nodeLabel(c,n){
  if(n.startsWith('e:')){const e=evOf(c,n.slice(2));return e?'หลักฐาน: '+(e.title||'(ไม่มีชื่อ)'):null;}
  if(n.startsWith('c:')){const x=c.characters.find(k=>k.id===n.slice(2));return x?'ผู้เกี่ยวข้อง: '+(x.name||'(ไม่มีชื่อ)'):null;}
  if(n.startsWith('t:')){const t=n.slice(2);return c.evidence.some(e=>e.time===t&&t)?'เวลา '+t:null;}
  return null;
}
function validateCase(c){
  const E=[],W=[],err=(m,w)=>E.push({m,w}),warn=(m,w)=>W.push({m,w});
  if(!c.title.trim())err('ยังไม่ได้ตั้งชื่อคดี','info');
  if(c.story.trim().length<10)err('เรื่องราวของคดีสั้นเกินไป (ต้องมีอย่างน้อย 10 ตัวอักษร)','info');
  const rn=c.rooms.map(r=>r.name.trim());
  if(rn.some(n=>!n))err('ชื่อห้องทั้ง 4 ห้องต้องไม่ว่าง','info');
  else if(new Set(rn).size<4)warn('มีชื่อห้องซ้ำกัน อาจทำให้สับสน','info');
  const nc=c.characters.length;
  if(nc<3||nc>5)err(`ต้องมีผู้เกี่ยวข้อง 3–5 คน (ตอนนี้ ${nc} คน)`,'chars');
  c.characters.forEach((x,i)=>{if(!x.name.trim())err(`ผู้เกี่ยวข้องคนที่ ${i+1} ยังไม่มีชื่อ`,'chars');});
  if(new Set(c.characters.map(x=>x.name.trim())).size<nc)warn('มีชื่อผู้เกี่ยวข้องซ้ำกัน','chars');
  const ne=c.evidence.length;
  if(ne<5||ne>8)err(`ต้องมีหลักฐาน 5–8 ชิ้น (ตอนนี้ ${ne} ชิ้น) — ถ้าไม่พอให้กด "เพิ่มหลักฐาน" หรือ "ทำสำเนา" ชิ้นเดิมแล้วแก้ไข ถ้าเกินให้ลบชิ้นที่ไม่จำเป็น`,'evidence');
  const hid=new Set(c.hypotheses.map(x=>x.id)),ans=c.hypotheses.find(x=>x.id===c.solution.answer);
  const evIds=new Set(c.evidence.map(e=>e.id)),chIds=new Set(c.characters.map(x=>x.id));
  const seenE=new Set();
  c.evidence.forEach((e,i)=>{
    const w='evidence:'+e.id,nm=`หลักฐาน #${i+1} "${e.title||'ไม่มีชื่อ'}"`;
    if(seenE.has(e.id))err(nm+': รหัสซ้ำ',w);seenE.add(e.id);
    if(!e.title.trim())err(nm+': ยังไม่มีชื่อหลักฐาน',w);
    if(e.desc.trim().length<5)err(nm+': ยังไม่มีคำอธิบายหลักฐาน (รายละเอียดที่จะเปิดเมื่อตอบถูก)',w);
    if(e.characterIds.some(id=>!chIds.has(id)))err(nm+': อ้างถึงผู้เกี่ยวข้องที่ไม่มีอยู่',w);
    if(e.supports&&!hid.has(e.supports))err(nm+': ระบุทางเลือกที่ชี้ไปไม่ถูกต้อง',w);
    const q=qOf(c,e.id);
    if(!q){err(nm+': ยังไม่มีคำถามผูกกับหลักฐานนี้',w);return;}
    if(!q.prompt.trim())err(nm+': โจทย์คำถามว่าง',w);
    if(q.type==='single-choice'){
      if(q.options.length<2)err(nm+': ต้องมีตัวเลือกอย่างน้อย 2 ข้อ (แนะนำ 4)',w);
      if(q.options.some(o=>!o.text.trim()))err(nm+': มีตัวเลือกที่ว่างอยู่',w);
      const tx=q.options.map(o=>o.text.trim().toLowerCase());
      if(new Set(tx).size<tx.length)err(nm+': มีตัวเลือกซ้ำกัน',w);
      if(!q.options.some(o=>o.id===q.answer))err(nm+': ยังไม่ได้เลือกคำตอบที่ถูก',w);
      if(q.options.length<4)warn(nm+': แนะนำให้มี 4 ตัวเลือก',w);
    }else if(q.type==='short-answer'){
      if(!q.answer.trim())err(nm+': คำตอบสั้นต้องมีแนวคำตอบให้ครูใช้ตัดสิน',w);
    }
    if(!q.explanation.trim())warn(nm+': ยังไม่มีคำอธิบายคำตอบ',w);
  });
  const nh=c.hypotheses.length;
  if(nh<3||nh>5)err(`ต้องมีทางเลือกสมมติฐาน 3–5 ข้อ (ตอนนี้ ${nh} ข้อ)`,'solution');
  c.hypotheses.forEach((x,i)=>{if(!x.text.trim())err(`ทางเลือกที่ ${i+1} ยังว่าง`,'solution');});
  const ht=c.hypotheses.map(x=>x.text.trim());
  if(new Set(ht).size<ht.length)err('มีทางเลือกสมมติฐานซ้ำกัน','solution');
  if(!ans)err('ยังไม่ได้เลือกทางเลือกที่เป็นเฉลย','solution');
  if(!c.solution.explanation.trim())err('ต้องกรอกคำอธิบายเฉลยก่อนเริ่มเล่น','solution');
  if(!c.solution.keyEvidence.length)err('ต้องเลือกหลักฐานหลักที่ใช้ยืนยันเฉลยอย่างน้อย 1 ชิ้น','solution');
  if(c.solution.keyEvidence.some(id=>!evIds.has(id)))err('หลักฐานหลักบางชิ้นไม่มีอยู่จริง','solution');
  if(!c.solution.steps.length)warn('ยังไม่มีขั้นตอนเฉลยทีละขั้น (จะแสดงเฉพาะคำอธิบายรวม)','solution');
  c.solution.steps.forEach((s,i)=>{if(!s.trim())err(`ขั้นเฉลยที่ ${i+1} ว่าง`,'solution');});
  /* consistency: clue must not contradict the answer */
  if(ans){
    c.solution.keyEvidence.forEach(id=>{const e=evOf(c,id);if(e&&e.supports&&e.supports!==ans.id)err(`หลักฐานหลัก "${e.title}" ถูกตั้งให้ชี้ไปทางเลือกอื่น ขัดกับเฉลย`,'evidence:'+id);});
    const keyE=c.solution.keyEvidence.map(id=>evOf(c,id)).filter(Boolean);
    if(keyE.length&&keyE.every(e=>!e.supports))warn('หลักฐานหลักยังไม่ได้ระบุว่า "ชี้ไปทางเลือกใด" — ระบุไว้จะช่วยตรวจความสอดคล้องกับเฉลย','evidence');
    const cnt={};c.evidence.forEach(e=>{if(e.supports)cnt[e.supports]=(cnt[e.supports]||0)+1;});
    c.hypotheses.forEach(x=>{if(x.id!==ans.id&&(cnt[x.id]||0)>=(cnt[ans.id]||0)&&cnt[x.id])warn(`หลักฐานที่ชี้ไปที่ "${x.text}" มีไม่น้อยกว่าที่ชี้ไปยังเฉลย อาจตีความได้หลายแบบ`,'evidence');});
    const secret=ans.text.trim();
    if(secret.length>=6){
      c.evidence.forEach(e=>{
        const q=qOf(c,e.id),texts=[e.title,e.desc,e.hint];
        if(q){texts.push(q.prompt);q.options.forEach(o=>texts.push(o.text));}
        if(texts.some(t=>t&&t.includes(secret)))err(`เฉลยหลุด: ข้อความของหลักฐาน "${e.title}" มีข้อความเดียวกับทางเลือกที่เป็นเฉลย`,'evidence:'+e.id);
        if(q&&q.explanation.includes(secret))warn(`คำอธิบายของ "${e.title}" มีข้อความเดียวกับเฉลย`,'evidence:'+e.id);
      });
      c.hypotheses.forEach(x=>{if(x.id!==ans.id&&x.feedback.includes(secret))err(`ข้อความแนะนำของทางเลือก "${x.text}" เฉลยหลุด`,'solution');});
    }
  }
  /* link rules */
  if(!c.links.length)err('ต้องกำหนดความเชื่อมโยงที่สมเหตุสมผลอย่างน้อย 1 คู่ (แท็บ "เส้นเชื่อม") ไว้ให้ระบบให้คะแนน','links');
  const seenL=new Set();
  c.links.forEach((l,i)=>{
    const nm=`ความเชื่อมโยง #${i+1}`;
    if(!nodeLabel(c,l.a)||!nodeLabel(c,l.b))err(nm+': อ้างถึงหลักฐาน/บุคคล/เวลาที่ไม่มีอยู่','links');
    else if(l.a===l.b)err(nm+': เชื่อมกับตัวเอง','links');
    if(!l.reason.trim())err(nm+': ยังไม่มีเหตุผลอธิบาย','links');
    const k=[l.a,l.b].sort().join('|');if(seenL.has(k))warn(nm+': ซ้ำกับคู่อื่น','links');seenL.add(k);
  });
  const g=c.gameConfig;
  if(g.enforceOrder&&c.evidence.length&&!c.evidence.some(e=>e.order===Math.min(...c.evidence.map(x=>x.order))))err('ลำดับเผยหลักฐานผิดพลาด','evidence');
  return{errors:E,warnings:W};
}

/* ---------- import / export ---------- */
function download(name,text,mime){
  const url=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));
  const a=h('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;if(/[",\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s;}
function toCSV(rows){return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[];}
    else cur+=ch;}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);
  return rows.map(r=>r.map(x=>/^'[=+\-@]/.test(x)?x.slice(1):x));
}
const CSV_HEAD=['prompt','optionA','optionB','optionC','optionD','answer','explanation','topic','difficulty','evidence'];
function questionsCSV(c){
  const rows=[CSV_HEAD];let skipped=0;
  c.evidence.forEach(e=>{const q=qOf(c,e.id);if(!q)return;
    if(q.type!=='single-choice'||q.options.length>4){skipped++;return;}
    const o=q.options.map(x=>x.text);while(o.length<4)o.push('');
    const idx=q.options.findIndex(x=>x.id===q.answer);
    rows.push([q.prompt,...o,'ABCD'[idx]||'',q.explanation,q.topic,q.difficulty,e.title]);});
  return{text:toCSV(rows),skipped};
}
/* CSV → extra single-choice questions, each attached to a NEW draft evidence the teacher must complete */
function importQuestionsCSV(c,text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('ไม่พบข้อมูลในไฟล์ CSV (ต้องมีหัวตารางและอย่างน้อย 1 แถว)');
  const head=rows[0].map(x=>x.trim().toLowerCase()),ix=n=>head.indexOf(n.toLowerCase());
  const need=['prompt','optionA','optionB','optionC','optionD','answer'];
  for(const n of need)if(ix(n)<0)throw new Error('หัวตาราง CSV ขาดคอลัมน์ "'+n+'" (ต้องมี: '+CSV_HEAD.join(', ')+')');
  let added=0,bad=0,full=false;
  for(const r of rows.slice(1)){
    if(c.evidence.length>=8){full=true;break;}
    const g=n=>(r[ix(n)]||'').trim();const opts=['optionA','optionB','optionC','optionD'].map(g);
    const letter=g('answer').toUpperCase(),ai='ABCD'.indexOf(letter);
    if(!g('prompt')||opts.filter(Boolean).length<2||ai<0||!opts[ai]){bad++;continue;}
    const eid=newEvidence(c),q=qOf(c,eid),e=evOf(c,eid);
    q.prompt=g('prompt').slice(0,240);q.options=opts.map((t,i)=>({id:'abcd'[i],text:t.slice(0,100)}));q.answer='abcd'[ai];
    q.explanation=g('explanation').slice(0,300);q.topic=g('topic').slice(0,60);q.difficulty=int(g('difficulty'),1,3,1);
    e.title=(g('evidence')||('หลักฐานจาก CSV #'+(added+1))).slice(0,60);

}
function resizeImage(file,maxPx=560){
  return new Promise((res,rej)=>{
    if(!file||!/^image\/(jpeg|png|webp|gif)$/.test(file.type))return rej(new Error('รองรับเฉพาะไฟล์ภาพ JPG/PNG/WEBP/GIF'));
    if(file.size>4*1024*1024)return rej(new Error('ไฟล์ภาพใหญ่เกิน 4 MB'));
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);let w=img.width,hh=img.height,s=Math.min(1,maxPx/Math.max(w,hh));w=Math.max(1,Math.round(w*s));hh=Math.max(1,Math.round(hh*s));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,hh);x.drawImage(img,0,0,w,hh);
      let out=cv.toDataURL('image/jpeg',.8);if(out.length>180000)out=cv.toDataURL('image/jpeg',.55);
      if(out.length>250000)return rej(new Error('ภาพยังใหญ่เกินไปหลังย่อ ลองใช้ภาพที่เล็กลง'));res(out);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('เปิดไฟล์ภาพไม่ได้'));};img.src=url;
  });
}
function pickFile(accept){
  return new Promise(res=>{const i=h('input',{type:'file',accept,style:'display:none'});document.body.append(i);
    i.addEventListener('change',()=>{const f=i.files&&i.files[0];i.remove();res(f||null);});
    i.addEventListener('cancel',()=>{i.remove();res(null);});i.click();});
}
const readText=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ'));r.readAsText(f,'utf-8');});

let afterChange=()=>{};

function fText(label,obj,key,{max=100,multi=false,rows=3,ph='',on,hint}={}){

let ac=null,musicT=null;
function audio(){if(ac===null){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=false;}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,dur=.15,type='sine',vol=.1,delay=0){
  if(!store.settings.sound)return;const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
}

function nodeText(n){
  if(n.startsWith('e:')){const e=ev(n.slice(2));return e?e.title:'?';}
  if(n.startsWith('c:')){const x=CASE.characters.find(k=>k.id===n.slice(2));return x?x.name:'?';}
  return 'เวลา '+n.slice(2);
}
function isLocked(e){return CASE.gameConfig.enforceOrder&&CASE.evidence.some(o=>o.order<e.order&&!done(o.id));}

function newGameState(){
  const s=store.settings,n=s.mode==='teams'?s.teamCount:1;

  return{v:1,mode:s.mode,teams,cur:0,collected:[],via:{},attempts:{},hinted:{},hintsLeft:CASE.gameConfig.hintsPerGame,pos:{},links:[],awarded:[],hyps:[],
    solved:null,revealStep:0,phase:'play',log:[],shuf:{},
    cfg:{scoreAnswer:s.scoreAnswer,scoreLink:s.scoreLink,scoreConclusion:s.scoreConclusion,secs:s.timerEnabled?CASE.gameConfig.questionSeconds:0,shuffle:s.shuffle},startedAt:Date.now()};
}

/* ---------- board ---------- */
function allTimes(){return[...new Set(CASE.evidence.map(e=>e.time).filter(Boolean))];}
function nodeList(){
  const n=[];
  CASE.characters.forEach(c=>n.push({id:'c:'+c.id,kind:'pe',name:c.name,sub:c.role}));
  CASE.evidence.filter(e=>done(e.id)).forEach(e=>n.push({id:'e:'+e.id,kind:'ev',name:e.title,sub:roomName(e.room)+(e.time?' · '+e.time:''),img:e.image}));
  const col=new Set(CASE.evidence.filter(e=>done(e.id)&&e.time).map(e=>e.time));
  allTimes().filter(t=>col.has(t)).forEach(t=>n.push({id:'t:'+t,kind:'ti',name:'เวลา '+t,sub:''}));
  return n;
}
function autoPos(id){
  if(id.startsWith('c:')){const i=CASE.characters.findIndex(c=>c.id===id.slice(2)),n=CASE.characters.length;return{x:.12+.76*(n>1?i/(n-1):.5),y:.09+(i%2)*.1};}
  if(id.startsWith('e:')){const k=G.collected.indexOf(id.slice(2));return{x:.14+.24*(k%4),y:.42+.2*Math.floor(k/4)};}
  const T=allTimes(),j=T.indexOf(id.slice(2));return{x:.08+.84*(T.length>1?j/(T.length-1):.5),y:.84+(j%2)*.09};
}
function ensureNodes(){nodeList().forEach(n=>{if(!G.pos[n.id])G.pos[n.id]=autoPos(n.id);});}
let lastFocusNode=null;
function renderBoard(){
  ensureNodes();
  const foc=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.node;
  [...UI.board.querySelectorAll('.note')].forEach(n=>n.remove());
  nodeList().forEach(n=>{
    const el=h('button',{class:'note '+n.kind+(selNode===n.id?' sel':''),type:'button','data-node':n.id,'aria-pressed':String(selNode===n.id),
      'aria-label':`${n.kind==='ev'?'หลักฐาน':n.kind==='pe'?'บุคคล':'เวลา'}: ${n.name}. กดเพื่อเลือกเชื่อมโยง ลูกศรเพื่อย้าย`,
      style:`left:${G.pos[n.id].x*100}%;top:${G.pos[n.id].y*100}%`},
      n.img?h('img',{src:n.img,alt:''}):null,h('span',null,n.name),n.sub?h('small',null,n.sub):null);
    bindNote(el,n.id);UI.board.append(el);
  });
  if(foc){const f=UI.board.querySelector(`[data-node="${CSS.escape(foc)}"]`);if(f)f.focus();}
  drawLines();renderLinkList();
}
function bindNote(el,id){
  let sx=0,sy=0,moved=false,drag=false;
  el.addEventListener('pointerdown',e=>{if(paused)return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);audio();});
  el.addEventListener('pointermove',e=>{
    if(!drag)return;if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;moved=true;el.style.cursor='grabbing';
    const r=UI.board.getBoundingClientRect();G.pos[id]={x:clamp((e.clientX-r.left)/r.width,.05,.95),y:clamp((e.clientY-r.top)/r.height,.06,.94)};
    el.style.left=G.pos[id].x*100+'%';el.style.top=G.pos[id].y*100+'%';drawLines();});
  el.addEventListener('pointerup',e=>{if(!drag)return;drag=false;el.style.cursor='';try{el.releasePointerCapture(e.pointerId);}catch(x){}
    if(moved){saveGame();e.preventDefault();el._moved=true;setTimeout(()=>{el._moved=false;},0);}});
  el.addEventListener('click',()=>{if(el._moved)return;pickNode(id);});
  el.addEventListener('keydown',e=>{
    const d={ArrowLeft:[-.03,0],ArrowRight:[.03,0],ArrowUp:[0,-.03],ArrowDown:[0,.03]}[e.key];
    if(d){e.preventDefault();e.stopPropagation();const p=G.pos[id];p.x=clamp(p.x+d[0],.05,.95);p.y=clamp(p.y+d[1],.06,.94);el.style.left=p.x*100+'%';el.style.top=p.y*100+'%';drawLines();saveGame();}
  });
}
function pickNode(id){

  if(selNode===id){selNode=null;renderBoard();return;}
  const a=selNode;selNode=null;renderBoard();openLinkDlg(a,id);

function drawLines(){

    const c=document.createElementNS(NS,'circle');c.setAttribute('cx',(x1+x2)/2);c.setAttribute('cy',(y1+y2)/2);c.setAttribute('r','13');c.setAttribute('fill',col);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','3');
    const t=document.createElementNS(NS,'text');t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2+5);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.setAttribute('font-size','14');t.setAttribute('font-weight','800');t.textContent=String(i+1);

/* ---------- opening a spot / question ---------- */
function openSpot(id){
  if(paused||!G)return;
  if(done(id))return showEvidence(id,false);
  const e=ev(id);if(isLocked(e)){toast('จุดนี้ยังไม่เปิด — ไปสืบจุดอื่นก่อนตามลำดับที่ครูกำหนด');SFX.soft();return;}
  openQuestion(id);
}
function optOrder(q){
  if(!G.cfg.shuffle)return q.options.map(o=>o.id);
  if(!G.shuf[q.id]){const a=q.options.map(o=>o.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}G.shuf[q.id]=a;}
  return G.shuf[q.id];
}
function openQuestion(id){
  const e=ev(id),secs=G.cfg.secs;
  Qs={evId:id,sel:null,done:false,tried:new Set(),remaining:secs*1000,total:secs*1000,running:secs>0,timedOut:false,revealed:false,fb:null,fbCls:'soft'};
  openDlg({title:`จุดสืบสวนที่ ${spotNo(id)} · ${roomName(e.room)}`,onClose:()=>{Qs=null;}});
  renderQ();
}
function renderQ(){
  if(!Qs)return;
  const e=ev(Qs.evId),q=qq(Qs.evId);
  const meta=h('div',{class:'meta'},h('span',{class:'chip'},roomName(e.room)),
    G.mode==='teams'?h('span',{class:'chip'},h('span',{class:'dot',style:'background:'+team().color}),'ตาของ '+team().name):null,
    h('span',{class:'chip'},['ง่าย','ปานกลาง','ยาก'][q.difficulty-1]));
  const nodes=[meta];
  if(Qs.total){nodes.push(h('div',{class:'tbar'+(Qs.remaining<10000?' low':''),id:'qbar',role:'timer','aria-label':'เวลาที่เหลือ'},h('i',{style:`width:${Math.max(0,Qs.remaining/Qs.total*100)}%`})));}
  nodes.push(h('div',{class:'qprompt',text:q.prompt}));
  const locked=Qs.done||Qs.timedOut;
  if(q.type==='single-choice'||q.type==='true-false'){
    const opts=q.type==='true-false'?[{id:'true',text:'ถูก / จริง'},{id:'false',text:'ผิด / ไม่จริง'}]:optOrder(q).map(i=>q.options.find(o=>o.id===i)).filter(Boolean);
    let elim=null;if(CASE.gameConfig.difficulty===1&&(G.attempts[Qs.evId]||0)>=2&&q.type==='single-choice')elim=opts.find(o=>o.id!==q.answer&&!Qs.tried.has(o.id));
    const grp=h('div',{class:'opts',role:'radiogroup','aria-label':'ตัวเลือกคำตอบ'});
    opts.forEach((o,i)=>{
      if(elim&&o.id===elim.id)return;
      const tried=Qs.tried.has(o.id);
      grp.append(h('button',{class:'opt'+(tried?' tried':''),type:'button',role:'radio','aria-checked':String(Qs.sel===o.id),'data-opt':o.id,disabled:locked||tried,
        onclick:()=>{SFX.click();Qs.sel=o.id;Qs.fb=null;renderQ();}},h('span',{class:'let'},q.type==='true-false'?(o.id==='true'?'✓':'✗'):LET[i]),h('span',null,o.text),tried?h('small',null,' (ลองแล้ว)'):null));});
    nodes.push(grp);
    if(elim)nodes.push(h('div',{class:'fb info'},'โหมดง่าย: ตัดตัวเลือกที่ไม่ใช่ออกให้ 1 ข้อแล้ว'));
  }else{
    nodes.push(h('div',{class:'fb info'},'ให้ทีมอภิปราย/ตอบด้วยปากเปล่า แล้วให้ครูกดตัดสินด้านล่าง'));
  }
  if(G.hinted[Qs.evId])nodes.push(h('div',{class:'fb info'},h('b',null,'คำใบ้: '),e.hint||'ลองอ่านโจทย์ช้า ๆ แล้วตัดสิ่งที่ไม่เกี่ยวข้องออกก่อน'));
  if(Qs.fb)nodes.push(h('div',{class:'fb '+Qs.fbCls,role:'status'},Qs.fb));
  if(Qs.revealed)nodes.push(h('div',{class:'revealbox'},h('b',null,'เฉลย: '),answerText(q),q.explanation?h('div',{text:q.explanation}):null));
  setDlgBody(nodes);
  const acts=[{label:'ปิด (Esc)',fn:closeDlg}];
  if(!Qs.done){
    if(!G.hinted[Qs.evId])acts.push({label:`ใบ้ (เหลือ ${G.hintsLeft})`,disabled:G.hintsLeft<=0,fn:()=>{act('ใช้คำใบ้',()=>{G.hintsLeft--;G.hinted[Qs.evId]=true;});SFX.found();renderQ();}});
    if(Qs.total)acts.push({label:'พักเวลา',fn:togglePause});
    if(Qs.timedOut)acts.push({label:'ต่อเวลา 30 วินาที',cls:'amber',fn:()=>{Qs.remaining+=30000;Qs.total=Math.max(Qs.total,Qs.remaining);Qs.timedOut=false;Qs.running=true;Qs.fb=null;renderQ();}});
  }
  if(!Qs.revealed)acts.push({label:'ครู: เฉลยข้อนี้',fn:()=>{Qs.revealed=true;renderQ();}});
  if(q.type==='short-answer'){
    if(!Qs.done)acts.push({label:'ยังไม่ถูก',fn:()=>resolveQ(false)},{label:'ครูตัดสิน: ตอบถูก',cls:'primary',fn:()=>resolveQ(true)});
  }else if(!locked)acts.push({label:'ยืนยันคำตอบ (Enter)',cls:'primary',id:'qConfirm',fn:submitQ});
  setDlgActions(acts);
  if(Qs.sel){const f=$(`[data-opt="${Qs.sel}"]`);if(f)f.focus();}
}
function answerText(q){
  if(q.type==='single-choice')return(q.options.find(o=>o.id===q.answer)||{}).text||'';
  if(q.type==='true-false')return q.answer?'ถูก / จริง':'ผิด / ไม่จริง';return q.answer;
}
function submitQ(){
  if(!Qs||Qs.done||Qs.timedOut)return;const q=qq(Qs.evId);
  if(Qs.sel==null){Qs.fb='เลือกคำตอบก่อน แล้วกดยืนยัน';Qs.fbCls='info';renderQ();return;}

function resolveQ(ok){

    act('ตอบยังไม่ถูก',()=>{G.attempts[id]=(G.attempts[id]||0)+1;G.teams[t].asked++;if(G.mode==='teams')G.cur=(G.cur+1)%G.teams.length;});

      h('h2',{text:'1) สิ่งที่เกิดขึ้น (ตามที่ผู้เล่นสรุป)'}),
      last?h('div',{class:'card'},h('p',null,h('b',null,'ข้อสรุป: '),hypText(last.choice)),h('p',null,h('b',null,'เหตุผล: '),last.reason),
        h('p',null,h('b',null,'หลักฐานที่ใช้ยืนยัน: '),last.evidence.map(i=>(ev(i)||{}).title).filter(Boolean).join(' · ')),
        h('p',{class:'hint',text:`ตั้งข้อสรุปทั้งหมด ${G.hyps.length} ครั้ง: `+G.hyps.map((x,i)=>`ครั้งที่ ${i+1} ${x.ok?'มีหลักฐานเพียงพอ':'ต้องการหลักฐานเพิ่ม'}`).join(' → ')})):
        h('div',{class:'card'},'ยังไม่ได้สรุปคดี — ครูอาจใช้ช่วงนี้อภิปรายสิ่งที่พบ แล้วเปิดเฉลยทีละขั้นด้านล่าง'),
      h('h2',{text:'2) หลักฐานหลัก'}),
      h('div',{style:'overflow:auto'},h('table',{class:'tbl'},h('thead',null,h('tr',null,['จุด','ห้อง','หลักฐาน','เวลา','สถานะ'].map(t=>h('th',{text:t})))),
        h('tbody',null,CASE.evidence.map(e=>h('tr',null,h('td',null,String(spotNo(e.id))),h('td',null,roomName(e.room)),
          h('td',null,(S.keyEvidence.includes(e.id)&&G.revealStep>=1?'★ ':'')+(done(e.id)?e.title:'(ยังไม่ได้สืบ)')),h('td',null,done(e.id)?e.time:''),h('td',null,evStatus(e.id))))))),
      h('h2',{text:'3) เหตุผลที่เชื่อมโยง'}),
      G.links.length?h('ol',null,G.links.map(l=>h('li',null,h('b',null,nodeText(l.a)+' ↔ '+nodeText(l.b)),' — '+l.text,l.ruleId?' ✓ สมเหตุสมผลตามที่ครูกำหนด':' (ข้อสังเกตของเรา)'))):h('p',{text:'ยังไม่มีเส้นเชื่อม'}),
      h('h2',{text:'4) หัวข้อที่ควรทบทวน'}),
      Object.keys(tops).length?h('ul',null,Object.entries(tops).map(([t,v])=>h('li',null,h('b',null,t),` — ${v.items.join(', ')}`))):h('p',{text:'ไม่มีหัวข้อที่ต้องทบทวนเป็นพิเศษ — ตอบถูกในครั้งแรกทุกจุดที่สืบ'}),
      h('h2',{text:'5) เฉลยจริง'}),
      revealParts.length?revealParts:h('p',{class:'muted',text:'ยังไม่เปิดเฉลย — ครูกดเปิดทีละขั้นหลังอภิปรายกับนักเรียน'}),
      h('div',{class:'row noprint',style:'margin:10px 0'},
        h('button',{class:'btn amber',disabled:G.revealStep>=total,onclick:()=>{act('เปิดเฉลย',()=>{G.revealStep++;});renderReport();SFX.found();}},G.revealStep>=total?'เปิดเฉลยครบแล้ว':`เปิดเฉลยขั้นถัดไป (${G.revealStep}/${total})`),
        h('button',{class:'btn',disabled:!G.revealStep,onclick:()=>{act('ซ่อนเฉลย',()=>{G.revealStep=0;});renderReport();}},'ซ่อนเฉลยทั้งหมด')),
      h('div',{class:'row noprint',style:'margin-top:22px'},
        h('button',{class:'btn primary',onclick:async()=>{if(!await confirmDlg('เล่นคดีนี้อีกครั้งตั้งแต่ต้น? ผลรอบนี้จะหายไป (ส่งออกผลไว้ก่อนได้)',{ok:'เล่นอีกครั้ง'}))return;beginGame(CASE,{demo:isDemo});}},'เล่นคดีนี้อีกครั้ง'),
        h('button',{class:'btn',onclick:()=>showScreen('scrHome')},'กลับหน้าแรก'))));
}

/* ---------- init / wiring ---------- */
function init(){
  probeStorage();loadStore();applySettings();refreshHome();
  $('#hmStart').onclick=()=>{audio();startFlow();};
  $('#hmResume').onclick=()=>{audio();resumeGame();};
  $('#hmStudio').onclick=()=>{renderStudio();showScreen('scrStudio');};
  $('#hmSettings').onclick=()=>{renderSettings();showScreen('scrSettings');};
  $('#hmHow').onclick=()=>{renderHow();showScreen('scrHow');};
  $('#hmDemo').onclick=()=>{audio();beginGame(normalizeCase(clone(SAMPLE)),{demo:true});};
  document.addEventListener('keydown',e=>{
    if($('#scrGame').hidden||!G)return;
    const tag=e.target.tagName,inField=['INPUT','TEXTAREA','SELECT'].includes(tag);
    if(inField)return;
    if(e.key===' '&&!['BUTTON','A'].includes(tag)){e.preventDefault();togglePause();return;}
    if(dlg.open||dlgC.open||paused)return;
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s'].includes(k)){keys[k]=true;if(k.startsWith('Arrow'))e.preventDefault();return;}
    if(e.key==='Enter'&&(tag==='BODY'||tag==='CANVAS')){const s=nearestSpot(P.x,P.y,50);if(s){e.preventDefault();openSpot(s.evId);}}
    if(e.key==='Escape'&&selNode){selNode=null;renderBoard();}
  });
  document.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;delete keys[k];});
  window.addEventListener('blur',()=>{for(const k in keys)delete keys[k];});
  window.addEventListener('beforeunload',()=>{persist(true);});
  window.addEventListener('error',()=>{showBanner('เกิดข้อผิดพลาดบางอย่าง ถ้าหน้าจอค้าง ให้โหลดหน้าใหม่ — ข้อมูลที่บันทึกไว้ยังอยู่');});
}
init();
})();
</script>
